# Fly.io app for symp-payout. Create with: fly apps create symp-payout
# Secrets: fly secrets set HMAC_SECRET=… ONCHAIN_RPC_URL=… PAYOUT_PRIVATE_KEY=… CALLBACK_URL=https://yoursite.com/webhooks/symp ONCHAIN_CHAIN_ID=8453

app = "symp-payout"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HTTP_ADDR = ":8088"
  SQLITE_PATH = "/data/payout.db"
  ONCHAIN_CHAIN_ID = "8453"
  MAX_PAYOUT_USD = "500"
  DAILY_LIMIT_USD = "2000"
  SLIPPAGE_BPS = "100"

[http_service]
  internal_port = 8088
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = "symp_payout_data"
  destination = "/data"
