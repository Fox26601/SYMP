name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Address registry + mainnet gate present
        run: |
          test -f docs/ADDRESSES.md
          grep -q '0x94F2a91c17f61A89C758dCbc4f31670f12CEBd64' docs/ADDRESSES.md
          grep -q 'TBD' docs/ADDRESSES.md
          grep -q 'symp-payout-prod' docs/ADDRESSES.md
          test -f Makefile
          test -f scripts/lib/network.sh
          grep -q 'CONFIRM_MAINNET' scripts/lib/network.sh
          chmod +x scripts/*.sh
          ./scripts/gate-demo.sh
          # Dry probes must not broadcast
          NETWORK=mainnet CONFIRM_MAINNET=1 SYMP_CHECK_ONLY=1 ./scripts/deploy-network.sh
          set +e
          NETWORK=mainnet CONFIRM_MAINNET= ./scripts/deploy-network.sh
          rc=$?
          set -e
          test "$rc" -eq 2

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv

  payout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go test ./...
      - run: go build -o /tmp/symp-payout ./cmd/symp-payout

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
